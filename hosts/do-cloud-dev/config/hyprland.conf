# Lean Omarchy-inspired Hyprland session for headless DO remoting.
# System-managed: /etc/do-cloud-dev/hyprland.conf → ~/.config/hypr/hyprland.conf

$terminal = foot
$mainMod = SUPER

# Virtual display — DigitalOcean has no physical monitor to capture.
exec-once = hyprctl output create headless HEADLESS-REMOTE
monitor = HEADLESS-REMOTE,1920x1080@60,0x0,1
workspace = 1, monitor:HEADLESS-REMOTE, default:true

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = false
    }
}

animations {
    enabled = yes
    animation = windows, 1, 3, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

# Quickshell bar (Omarchy-like shell surface) + remoters tied to this session.
exec-once = quickshell -p /etc/do-cloud-dev/quickshell
exec-once = systemctl --user start wayvnc.service
exec-once = systemctl --user start rustdesk.service
exec-once = $terminal

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
