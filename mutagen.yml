# Mutagen project file: two-way sync of this dotfiles repo to the personal
# NixOS dev box. Start with `mutagen project start`, stop with
# `mutagen project terminate`, force one sync pass with `mutagen project flush`.
#
# Beta is addressed by Tailscale MagicDNS: the host takes its LAN address from
# DHCP and moves (10.100.10.142 -> .143), while the tailnet name is stable and
# reachable from anywhere, not just the home LAN.
sync:
  defaults:
    mode: two-way-resolved
    flushOnCreate: true
    ignore:
      vcs: true
      paths:
        - "**/.DS_Store"
        - "**/Thumbs.db"
        # Repo-local build/state output (gitignored, machine-specific).
        - "/.local"
        - "/dotfiles"

  dotfiles:
    # Run mutagen from the repo root, so the paths below are repo-relative.
    alpha: .
    beta: blesswinsamuel@hp-chromebox-g2.li-danio.ts.net:/home/blesswinsamuel/dotfiles
